# TV Emulator usage limits.
# Edit this value (and re-run scripts/install_killswitch.sh, or edit the copy at
# /etc/tv-emulator/limits.conf directly) to change the daily allowance.
#
# Cumulative powered-on minutes allowed per calendar day (local time, Europe/Madrid).
# Once exceeded the device powers off; turning it back on the same day powers it
# off again within ~1 minute. The allowance resets at local midnight.
DAILY_LIMIT_MINUTES=60
