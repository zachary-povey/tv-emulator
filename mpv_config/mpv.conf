# =========================================
# STABILITY SETTINGS (Prevents Crashes)
# =========================================
# Use hardware decoding only if safe/supported (Best balance of battery vs. stability)
hwdec=auto-safe

# If you need to use the failsafe video output we discussed earlier (uncomment if needed)
# vo=x11
# or
# vo=sdl

# =========================================
# FAN NOISE / EFFICIENCY SETTINGS
# =========================================
# Use the most efficient (fastest) scaling methods
# This looks slightly less sharp but saves massive amounts of CPU power
scale=bilinear
cscale=bilinear
dscale=bilinear

# Disable expensive processing
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
dither-depth=no

# Prevent mpv from looping indefinitely if it gets stuck (good for your specific crash)
# This stops it from holding the audio device hostage if it freezes
keep-open=no

# (Optional) The Nuclear Option: Disable "Deblocking"
# This makes video look a bit blocky/pixelated, but saves MASSIVE CPU power.
# vd-lavc-skiploopfilter=all

volume-max=180
sub-auto=fuzzy
sid=auto
slang=en,eng,english,es